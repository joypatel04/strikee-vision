<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strikee Vision — Local Core</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0;
           background: #0f1216; color: #e6e9ef; }
    header { padding: 14px 24px; border-bottom: 1px solid #232833;
             display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #f0b429; }
    .dot.ok { background: #22c55e; }
    .spacer { flex: 1; }
    select, button { background: #161b22; color: #e6e9ef; border: 1px solid #2b3240;
             border-radius: 7px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
    button:hover { border-color: #3b4658; }
    main { padding: 22px; }
    .muted { color: #8b93a1; font-size: 13px; }
    .grid { display: grid; gap: 12px; margin-top: 16px;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .asset { background: #161b22; border: 1px solid #232833; border-left-width: 4px;
             border-radius: 10px; padding: 14px 16px; }
    .asset .name { font-weight: 600; font-size: 14px; }
    .asset .label { font-size: 13px; margin-top: 6px; }
    .asset .meta { font-size: 11px; color: #8b93a1; margin-top: 8px; }
    .s-available { border-left-color: #22c55e; }
    .s-occupied  { border-left-color: #ef4444; }
    .s-active    { border-left-color: #ef4444; }
    .s-idle      { border-left-color: #f0b429; }
    .s-degraded  { border-left-color: #f97316; }
    .s-unknown   { border-left-color: #6b7280; }
    button.danger { border-color: #a33; color: #d66; }
    button.danger:hover { background: #a33; color: #fff; }
    .statusbar { display: flex; align-items: center; gap: 14px; font-size: 12px;
                 color: #8b93a1; margin-top: 4px; flex-wrap: wrap; }
    .panels { display: grid; gap: 16px; margin-top: 24px;
              grid-template-columns: 1fr 1fr; }
    @media (max-width: 800px) { .panels { grid-template-columns: 1fr; } }
    .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
                color: #8b93a1; margin: 0 0 8px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
           border: 1px solid #232833; border-radius: 8px; margin-bottom: 6px;
           font-size: 13px; background: #12161c; }
    .row .grow { flex: 1; }
    .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px;
             border: 1px solid #2b3240; color: #b9c0cc; }
    .b-detected { color: #f0b429; border-color: #6b551b; }
    .b-confirmed { color: #22c55e; border-color: #245e37; }
    .b-corrected { color: #60a5fa; border-color: #294a73; }
    .b-voided { color: #8b93a1; text-decoration: line-through; }
    .mini { font-size: 11px; padding: 3px 8px; }
    .ts { color: #8b93a1; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Strikee Vision — Local Core</h1>
    <span class="muted" id="version"></span>
    <span class="badge" id="syncBadge" title="cloud sync health" style="display:none"></span>
    <div class="spacer"></div>
    <select id="venueSelect"></select>
    <button id="startBtn">Start pipeline</button>
    <button id="stopBtn">Stop</button>
    <button id="renameBtn" title="Rename this venue">Rename</button>
    <button id="deleteBtn" class="danger" title="Delete this venue and all its data">Delete</button>
  </header>
  <main>
    <div class="statusbar" id="statusbar"></div>
    <div class="statusbar" id="analytics"></div>
    <div class="grid" id="grid"></div>
    <div class="muted" id="empty" style="margin-top:16px"></div>
    <div class="panels">
      <div class="panel">
        <h2>Sessions</h2>
        <div id="sessions"></div>
      </div>
      <div class="panel">
        <h2>Recent events</h2>
        <div id="events"></div>
      </div>
      <div class="panel">
        <h2>Notifications</h2>
        <div id="notifications"></div>
      </div>
      <div class="panel" style="grid-column: 1 / -1;">
        <h2>Games today (with evidence snapshots)</h2>
        <div id="games"></div>
      </div>
    </div>
  </main>

  <script>
    let ws = null, currentVenue = null, assets = {};

    const labelClass = (label) => {
      if (label === 'Available') return 's-available';
      if (label === 'Active (In Use)') return 's-active';
      if (label === 'Occupied – Idle') return 's-idle';
      if (label === 'Occupied') return 's-occupied';
      if (label === 'Degraded') return 's-degraded';
      return 's-unknown';
    };

    function renderGrid() {
      const grid = document.getElementById('grid');
      const list = Object.values(assets);
      document.getElementById('empty').textContent =
        list.length ? '' : 'No assets configured for this venue yet.';
      grid.innerHTML = list.map(a => `
        <div class="asset ${labelClass(a.label)}">
          <div class="name">${a.name}</div>
          <div class="label">${a.label || 'Unknown'}</div>
          <div class="meta">presence: ${a.presence||'-'} · activity: ${a.activity||'-'}
               · health: ${a.health||'-'}${a.confidence!=null?` · conf ${a.confidence}`:''}</div>
        </div>`).join('');
    }

    async function loadAssets(venueId) {
      assets = {};
      const res = await fetch(`/api/assets?venue_id=${venueId}`);
      for (const a of await res.json()) {
        assets[a.id] = { asset_id: a.id, name: a.name, label: 'Unknown' };
      }
      renderGrid();
    }

    function applySnapshot(list) {
      for (const s of list) {
        assets[s.asset_id] = { ...assets[s.asset_id], ...s };
      }
      renderGrid();
    }

    function connectWs(venueId) {
      if (ws) { ws.close(); ws = null; }
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/venues/${venueId}`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') applySnapshot(msg.assets);
      };
    }

    async function refreshStatus() {
      if (!currentVenue) return;
      const s = await (await fetch(`/api/venues/${currentVenue}/pipeline/status`)).json();
      document.getElementById('statusbar').textContent =
        `pipeline: ${s.running ? 'running' : 'stopped'} · assets ${s.assets} · sources ${s.sources} · every ${s.interval_sec}s`;
    }

    async function refreshSync() {
      const el = document.getElementById('syncBadge');
      let s;
      try { s = await (await fetch('/api/sync-health')).json(); }
      catch { return; }
      if (!s.sync_enabled) { el.style.display = 'none'; return; }  // local-only: hide
      el.style.display = '';
      const age = s.seconds_since_sync;
      const ago = age == null ? 'never' :
        (age < 90 ? `${Math.round(age)}s ago` : `${Math.round(age/60)}m ago`);
      if (s.healthy) {
        el.textContent = `☁ synced ${ago}`;
        el.style.color = '#22c55e'; el.style.borderColor = '#245e37';
        el.title = `cloud sync OK · ${s.sync_count} syncs · last ${s.last_success_at || '—'}`;
      } else {
        el.textContent = `⚠ NOT syncing (${ago})`;
        el.style.color = '#ef4444'; el.style.borderColor = '#7f1d1d';
        el.title = `sync stalled · ${s.consecutive_failures} fails · ${s.last_error || 'no successful sync yet'}`;
      }
    }

    const assetName = (id) => (assets[id] && assets[id].name) || id?.slice(0, 6) || '—';
    const shortTime = (ts) => ts ? new Date(ts).toLocaleTimeString() : '—';
    const dur = (sec) => sec == null ? 'open' :
      (sec >= 60 ? `${Math.floor(sec/60)}m ${sec%60}s` : `${sec}s`);

    async function reviewAction(id, action) {
      await fetch(`/api/sessions/${id}/${action}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ actor: 'dashboard' }),
      });
      loadSessions();
    }
    window.reviewAction = reviewAction;

    async function loadSessions() {
      if (!currentVenue) return;
      const rows = await (await fetch(`/api/venues/${currentVenue}/sessions?limit=30`)).json();
      document.getElementById('sessions').innerHTML = rows.length ? rows.map(s => `
        <div class="row">
          <span class="grow">${assetName(s.asset_id)}
            <span class="ts">${shortTime(s.start_ts)} → ${s.end_ts ? shortTime(s.end_ts) : 'now'} · ${dur(s.duration_sec)}</span>
          </span>
          <span class="badge b-${s.status}">${s.status}</span>
          ${s.status !== 'voided' ? `
            <button class="mini" onclick="reviewAction('${s.id}','confirm')">✓</button>
            <button class="mini" onclick="reviewAction('${s.id}','void')">✕</button>` : ''}
        </div>`).join('') : '<div class="muted">No sessions yet.</div>';
    }

    async function loadAnalytics() {
      if (!currentVenue) return;
      const a = await (await fetch(`/api/venues/${currentVenue}/analytics/summary`)).json();
      const o = a.overview || {};
      const bu = (a.by_business_unit || []).map(b =>
        `${b.business_unit_id}: ${b.session_count} sessions`).join(' · ');
      document.getElementById('analytics').textContent =
        `today: ${o.active_sessions||0} active · ${o.total_sessions||0} sessions · ${o.total_events||0} events${bu ? '  —  ' + bu : ''}`;
    }

    async function loadEvents() {
      if (!currentVenue) return;
      const rows = await (await fetch(`/api/venues/${currentVenue}/events?limit=30`)).json();
      document.getElementById('events').innerHTML = rows.length ? rows.map(e => `
        <div class="row">
          <span class="grow">${assetName(e.asset_id)}
            <span class="ts">${e.type}${e.label ? ' · ' + e.label : ''}</span>
          </span>
          <span class="ts">${shortTime(e.ts)}</span>
        </div>`).join('') : '<div class="muted">No events yet.</div>';
    }

    async function notifAction(id, action) {
      await fetch(`/api/notifications/${id}/${action}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ actor: 'dashboard' }),
      });
      loadNotifications();
    }
    window.notifAction = notifAction;

    async function loadNotifications() {
      if (!currentVenue) return;
      const rows = await (await fetch(`/api/venues/${currentVenue}/notifications?limit=30`)).json();
      const open = rows.filter(n => n.status !== 'resolved');
      document.getElementById('notifications').innerHTML = open.length ? open.map(n => `
        <div class="row">
          <span class="grow">${n.title || n.severity}
            <span class="ts">${n.message || ''}</span>
          </span>
          <span class="badge">${n.severity}</span>
          <span class="badge">${n.status}</span>
          ${n.status !== 'resolved' ? `
            <button class="mini" onclick="notifAction('${n.id}','ack')">ack</button>
            <button class="mini" onclick="notifAction('${n.id}','resolve')">✓</button>` : ''}
        </div>`).join('') : '<div class="muted">No open notifications.</div>';
    }

    async function loadGames() {
      if (!currentVenue) return;
      const today = new Date().toISOString().slice(0, 10);
      const data = await (await fetch(`/api/venues/${currentVenue}/games?date=${today}`)).json();
      const g = document.getElementById('games');
      g.innerHTML = data.games.length ? (
        `<div class="muted" style="margin-bottom:6px">${data.count} game(s) today</div>` +
        data.games.map(x => `
        <div class="row">
          ${x.snapshot ? `<a href="${x.snapshot}" target="_blank"><img src="${x.snapshot}" style="height:44px;border-radius:4px;border:1px solid #2b3240"></a>` : ''}
          <span class="grow">${x.table}
            <span class="ts">${shortTime(x.start_ts)}${x.end_ts ? ' → ' + shortTime(x.end_ts) : ' (in progress)'}${x.duration_sec != null ? ' · ' + dur(x.duration_sec) : ''}</span>
          </span>
        </div>`).join('')) : '<div class="muted">No games recorded today yet.</div>';
    }

    async function selectVenue(venueId) {
      currentVenue = venueId;
      await loadAssets(venueId);
      connectWs(venueId);
      refreshStatus();
      loadSessions();
      loadEvents();
      loadAnalytics();
      loadNotifications();
      loadGames();
    }

    async function init() {
      const h = await (await fetch('/health')).json();
      document.getElementById('dot').classList.add('ok');
      document.getElementById('version').textContent = 'v' + h.version;

      const venues = await (await fetch('/api/venues')).json();
      const sel = document.getElementById('venueSelect');
      sel.innerHTML = venues.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
      sel.onchange = () => selectVenue(sel.value);

      document.getElementById('startBtn').onclick = async () => {
        await fetch(`/api/venues/${currentVenue}/pipeline/start`, { method: 'POST' });
        refreshStatus();
      };
      document.getElementById('stopBtn').onclick = async () => {
        await fetch(`/api/venues/${currentVenue}/pipeline/stop`, { method: 'POST' });
        refreshStatus();
      };

      document.getElementById('renameBtn').onclick = async () => {
        const current = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
        const name = prompt('New name for this venue:', current);
        if (!name || !name.trim() || name === current) return;
        const r = await fetch(`/api/venues/${currentVenue}/rename`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name.trim() }),
        });
        if (!r.ok) { alert('Rename failed: ' + (await r.text())); return; }
        location.reload();
      };

      document.getElementById('deleteBtn').onclick = async () => {
        // Say exactly what is about to be destroyed - "delete this venue?" is a
        // very different question from "delete 4 tables and 1,182 events?".
        const info = await (await fetch(`/api/venues/${currentVenue}/contents`)).json();
        const c = info.counts;
        const lines = [
          `Delete "${info.venue.name}" and everything it holds?`, '',
          `  ${c.assets} table(s)/station(s)`,
          `  ${c.video_sources} camera(s)`,
          `  ${c.sessions} session(s)`,
          `  ${c.events} event(s)`,
          `  ${c.snapshots} evidence snapshot(s)`, '',
          'This cannot be undone.',
        ];
        if (!confirm(lines.join('\n'))) return;
        if (!confirm(`Really delete "${info.venue.name}"? Last chance.`)) return;
        const r = await fetch(`/api/venues/${currentVenue}`, { method: 'DELETE' });
        if (!r.ok) { alert('Delete failed: ' + (await r.text())); return; }
        location.reload();
      };

      if (venues.length) selectVenue(venues[0].id);
      else document.getElementById('empty').textContent =
        'No venues yet. Run field_setup.py to draw zones and create one.';
      refreshSync();
      setInterval(() => { refreshStatus(); refreshSync(); loadSessions(); loadEvents(); loadAnalytics(); loadNotifications(); loadGames(); }, 5000);
    }
    init();
  </script>
</body>
</html>
