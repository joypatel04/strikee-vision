[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strikee-local-core"
version = "0.1.0"
description = "Strikee Vision Local Core — on-site operations intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
