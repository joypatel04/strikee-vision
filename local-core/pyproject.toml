[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strikee-local-core"
version = "0.1.0"
description = "Strikee Vision Local Core — on-site operations intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.scripts]
strikee-core = "app.desktop:main"
strikee-doctor = "app.doctor:main"
strikee-backup = "app.backup:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Heavy perception stack — only needed to run the real YOLO/OpenCV pipeline,
# not for tests (which use fakes). Install with: pip install -e ".[perception]"
perception = [
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "numpy>=1.26",
]
# Native desktop window (otherwise the launcher falls back to the browser).
desktop = [
    "pywebview>=5.0",
]
# Building a Windows executable.
build = [
    "pyinstaller>=6.0",
]
# Object-storage backup (SQLite -> R2/S3) and snapshot upload.
cloud = [
    "boto3>=1.34",
]
# Turso (libSQL) cloud-synced database backend.
turso = [
    "libsql>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
